# Release images: turn usb-moded's rescue mode off.
#
# usb-moded.service sets Environment=USB_MODED_ARGS=-r (rescue mode), and the
# EnvironmentFile= lines (/etc/default/usb-moded.d/*.conf, read in sorted
# order) override it. Rescue mode exposes USB networking and SSH until lightdm
# starts, so anyone with a cable could log in during boot. An empty value
# passes no arguments to usb_moded. This file sorts after bluejay.conf and
# device-specific-config.conf, so it wins over both.
#
# Developer access can still be turned on on purpose: Developer Mode in System
# Settings (adb), or /userdata/.force-adb or /userdata/.force-ssh
# (tools/install.py --dev-access).
USB_MODED_ARGS=""
