name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl fakeroot flex git kmod \
            libbpf-dev libelf-dev libssl-dev lz4 pahole python-is-python3 python3 \
            unzip wget xz-utils

      - name: Build kernel, boot.img and device tarball
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: device-bluejay
          path: |
            out/device_bluejay.tar.xz
            out/device_bluejay.tar.build
            out/Module.symvers

  flashable:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: device-bluejay
          path: out

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils e2fsprogs fakeroot git jq wget xz-utils zstd

      - name: Fetch build tools and stage the port
        run: ./build.sh -s

      - name: Make flashable images
        run: |
          ./make-flashable.sh
          zstd -T0 -12 --rm out/system.img

      - uses: actions/upload-artifact@v4
        with:
          name: flashable-bluejay
          path: |
            out/boot.img
            out/system.img.zst
