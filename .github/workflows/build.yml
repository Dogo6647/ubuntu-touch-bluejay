name: build

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'CHANGELOG.md', 'docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      variant:
        description: Image variant (see make-flashable.sh)
        type: choice
        options: [devel, release]
        default: devel
  # release.yml builds the release variant through this workflow
  workflow_call:
    inputs:
      variant:
        description: Image variant, devel or release (see make-flashable.sh)
        type: string
        default: devel

permissions:
  contents: read

jobs:
  # Ubuntu Touch packages rebuilt with fixes for this port. Native arm64, built
  # against the UBports 24.04-2.x archive.
  packages:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Add the UBports 24.04-2.x archive
        run: |
          sudo curl -fsSL -o /usr/share/keyrings/ubports.gpg https://repo.ubports.com/keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/ubports.gpg] https://repo.ubports.com/ 24.04-2.x main" |
            sudo tee /etc/apt/sources.list.d/ubports.list
          # Build against the UBports versions (e.g. PulseAudio 16.1 with
          # pulseaudio-dev), as on the phone
          printf 'Package: *\nPin: origin repo.ubports.com\nPin-Priority: 1001\n' |
            sudo tee /etc/apt/preferences.d/ubports.pref
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --allow-downgrades build-essential devscripts equivs fakeroot git pulseaudio

      - name: Build pulseaudio-modules-droid
        run: packages/pulseaudio-modules-droid/build.sh out/extra-debs

      - uses: actions/upload-artifact@v7
        with:
          name: extra-debs
          path: out/extra-debs/*.deb
          if-no-files-found: error

  build:
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl fakeroot flex git kmod \
            libbpf-dev libelf-dev libssl-dev lz4 pahole python-is-python3 python3 \
            unzip wget xz-utils

      - uses: actions/download-artifact@v8
        with:
          name: extra-debs
          path: workdir/extra-debs

      - name: Build kernel, boot.img and device tarball
        run: ./build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: device-bluejay
          path: |
            out/device_bluejay.tar.xz
            out/device_bluejay.tar.build
            out/Module.symvers
          if-no-files-found: error

  flashable:
    needs: build
    runs-on: ubuntu-24.04
    env:
      # inputs is empty on push and pull_request
      VARIANT: ${{ inputs.variant || 'devel' }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: device-bluejay
          path: out

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils e2fsprogs fakeroot git jq lz4 python3 wget xz-utils zstd

      - name: Fetch build tools and stage the port
        run: ./build.sh -s

      - name: Make flashable images (${{ env.VARIANT }})
        run: |
          ./make-flashable.sh --variant "$VARIANT"
          zstd -T0 -12 --rm out/system.img
          cd out
          sha256sum boot.img boot-installer.img system.img.zst build-info.txt > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: flashable-bluejay
          path: |
            out/boot.img
            out/boot-installer.img
            out/system.img.zst
            out/build-info.txt
            out/SHA256SUMS
          if-no-files-found: error
