# Required, not optional: the ELF-TLS-capable libhybris (26.04-1.x) needs about
# 1.7 KB of static TLS (its linker q.so alone has 1568 bytes of initial-exec
# TLS), more than glibc's default surplus, so every process that loads it
# (getprop in lxc-android-ready, usb-moded's configurator, EGL clients, ofono,
# sensorfw, hfd, repowerd...) needs this. Same value as upstream
# lxc-android-config.
[Manager]
DefaultEnvironment=GLIBC_TUNABLES=glibc.rtld.optional_static_tls=4096
