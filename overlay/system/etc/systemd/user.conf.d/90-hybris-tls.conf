# Optional safety margin (not in the Pixel 9 port): give every system service that
# ends up in the hybris linker (getprop in lxc-android-ready, deviceinfo users,
# ofono-wrapper's device-info call, ...) the same static TLS reservation.
[Manager]
DefaultEnvironment=GLIBC_TUNABLES=glibc.rtld.optional_static_tls=4096
