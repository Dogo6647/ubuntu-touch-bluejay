# Pixel 6a (bluejay)
#
# The Halium android14-6.1 kernel has no MTP gadget function (no f_mtp), and
# UT's mtp-server needs /dev/mtp_usb, so the mtp modes can't be set up. Default
# to charging only and refuse the mtp modes: otherwise force-adb saves "mtp" on
# the first boot (no passcode yet), and Developer Mode would then ask for
# mtp_adb, which fails. Developer Mode asks for charging_only_adb instead.
#
# While porting, create /userdata/.force-adb (adb) or /userdata/.force-ssh
# (USB networking + SSH) on the phone instead of changing this file.
[usbmode]
mode=charging_only
whitelist=charging_only_adb,developer_mode,rndis,rndis_adb
hide=mtp,mtp_adb
