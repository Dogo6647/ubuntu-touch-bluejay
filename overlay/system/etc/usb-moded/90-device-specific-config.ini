# Pixel 6a (bluejay)
#
# The Halium android14-6.1 kernel has no MTP gadget function (no f_mtp), and
# UT's mtp-server needs /dev/mtp_usb, so UT's default mode "mtp" can't be set
# up and every plug-in would fail. Default to charging only; the Developer Mode
# switch in System Settings then asks for charging_only_adb, which works.
#
# While porting, create /userdata/.force-adb (adb) or /userdata/.force-ssh
# (USB networking + SSH) on the phone instead of changing this file.
[usbmode]
mode=charging_only
