# usb-moded / ubports-usb-moded-configurator settings for the Pixel 6a.
# Read by usb-moded.service (EnvironmentFile=-/etc/default/usb-moded.d/*.conf),
# including its ExecStartPre /usr/libexec/ubports-usb-moded-configurator.

# Keep usb-moded's rescue mode (the default, USB_MODED_ARGS=-r) during
# bring-up: the phone exposes "developer_mode" (network gadget + udhcpd +
# SSH) until usb-rescue-mode-off.service runs, which happens as soon as
# lightdm has started, not when the UI is up. For SSH that lasts, create
# /userdata/.force-ssh. Uncomment once the port boots reliably to the UI.
# USB_MODED_ARGS=""

# Network gadget: the Halium android14-6.1 kernel has
#   CONFIG_USB_CONFIGFS_NCM=y and "# CONFIG_USB_CONFIGFS_RNDIS is not set",
# so the configurator's autodetection (rndis.usb0 -> ncm.usb0 -> ecm.usb0)
# already ends up on CDC-NCM, which macOS supports natively. Leave these
# commented unless autodetection misbehaves; when set, both must be set.
# RNDIS_FUNCTION=ncm.usb0
# RNDIS_IFNAME=usb0

# USB IDs: the stock Pixel 6a identities (Google VID 0x18d1, PIDs used by
# stock Android for the same function sets). Without these the configurator
# falls back to pid.codes test IDs 1209:0002..0006.
IDVENDOR=18d1
IDPRODUCT_MTP=4ee1
IDPRODUCT_MTP_ADB=4ee2
IDPRODUCT_RNDIS=4ee3
IDPRODUCT_RNDIS_ADB=4ee4
IDPRODUCT_CHARGING_ONLY_ADB=4ee7

# Set everything the configurator would otherwise ask getprop for, so USB
# doesn't depend on libhybris or on the Android container (the configurator
# runs under "sh -eu": an aborting getprop makes usb-moded fail with 134).
# The vendor sets sys.usb.controller only "on charger" (init.gs101.usb.rc).
MANUFACTURER=Google
PRODUCT="Pixel 6a"
CONTROLLER=11110000.dwc3
