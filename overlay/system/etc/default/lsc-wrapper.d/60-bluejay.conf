# Sourced by /usr/share/ubuntu-touch-session/lsc-wrapper. lightdm starts
# lomiri-system-compositor with a cleared environment (no systemd
# DefaultEnvironment, no /etc/profile.d), so the hybris environment is set
# here, before the first getprop. Modelled on the UBports Pixel 9 (zumapro,
# Halium 16) port's 60-zumapro.conf.

# Never open hwcomposer.gs101.so in-process: the vendor composer service owns
# it. Also set by halium-gki's 10-force-hwc2.conf.
export MIR_ANDROID_FORCE_HWC2=1

# Static TLS for libhybris and the Android 16 libraries, which use TLSDESC.
export GLIBC_TUNABLES=glibc.rtld.optional_static_tls=4096

# [TEMP] libui (Gralloc5) and libGLES_mali.so load the stable-C mapper
# mapper.pixel.so from /vendor/lib64/hw, which the hybris linker doesn't find
# through linkerconfig (same workaround as the Pixel 9 port).
export HYBRIS_LD_LIBRARY_PATH=/vendor/lib64/hw

# Wait, at most 90 s, for the HIDL composer 2.4 and the AIDL allocator
# (vendor/etc/init/*.rc on bluejay). lightdm.conf.d/60-bluejay.conf gives the
# compositor 150 s in total.
n=0
while [ $n -lt 180 ]; do
    [ "$(getprop init.svc.vendor.hwcomposer-2-4 2>/dev/null)" = "running" ] &&
        [ "$(getprop init.svc.vendor.graphics.allocator-default 2>/dev/null)" = "running" ] &&
        break
    sleep 0.5
    n=$((n + 1))
done
