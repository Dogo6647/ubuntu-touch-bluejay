# Sourced by /usr/share/ubuntu-touch-session/lsc-wrapper (lomiri-system-compositor
# runs as root from lightdm and does NOT source /etc/profile.d), so the hybris
# environment is repeated here. Modelled on the UBports Pixel 9 (zumapro, Halium 16)
# port: overlay/system/etc/default/lsc-wrapper.d/60-zumapro.conf.

# Wait (bounded) for the vendor HIDL composer 2.4 service; on bluejay it is
# "vendor.hwcomposer-2-4" (vendor/etc/init/android.hardware.graphics.composer@2.4-service.rc).
n=0
while [ "$(getprop init.svc.vendor.hwcomposer-2-4 2>/dev/null)" != "running" ] && [ $n -lt 120 ]; do
    sleep 0.5
    n=$((n + 1))
done

# Never open hwcomposer.gs101.so in-process (the vendor composer service already owns it).
# Also set by halium-gki's 10-force-hwc2.conf; repeated so this file is self-contained.
export MIR_ANDROID_FORCE_HWC2=1

# Static TLS reservation needed by the ELF-TLS-capable libhybris (libhybris MR !65 /
# libhybris PR #622); the Android 16 blobs (libGLES_mali.so, libc++.so, libbinder.so ...)
# use TLSDESC.
export GLIBC_TUNABLES=glibc.rtld.optional_static_tls=4096

# [TEMP] libui (Gralloc5) and libGLES_mali.so load the stable-C mapper "mapper.pixel.so"
# from /vendor/lib64/hw; the hybris linker does not find it via linkerconfig (same
# workaround as Pixel 9 and the Halium 14 MTK ports).
export HYBRIS_LD_LIBRARY_PATH=/vendor/lib64/hw
