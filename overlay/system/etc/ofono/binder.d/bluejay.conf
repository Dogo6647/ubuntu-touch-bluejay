# ofono-binder-plugin for the Pixel 6a (Samsung Shannon s5123 RIL, rild_exynos).
# Vendor exposes HIDL android.hardware.radio@1.6::IRadio/slot1,slot2 on /dev/hwbinder
# (vendor/etc/vintf/manifest.xml). ofono-binder-plugin 1.1.33 / libgbinder-radio speak
# HIDL up to 1.5; a 1.6 service is also registered under its 1.5 parent interface.
[Settings]
Device = /dev/hwbinder
InterfaceType = hidl
ExpectSlots = slot1,slot2
3GLTEHandover = false
MaxNonDataMode = none
radioInterface = 1.5
emptyPinQuery = false
useDataProfiles = true
signalStrengthRange = -113,-51
