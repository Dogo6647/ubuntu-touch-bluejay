# bcmdhd4389 also exposes a Wi-Fi Aware (NAN) interface, aware_nmi0, and a
# second station interface, wlan1. NetworkManager picked aware_nmi0 to join a
# network, and when cfg80211 later disconnected it, the stock driver
# dereferenced NULL in wl_cfg80211_disconnect and panicked the kernel (on every
# boot once a network was saved). Only manage wlan0. Same as the Pixel 9 port.
[keyfile]
unmanaged-devices=interface-name:aware_nmi*;interface-name:wlan1
