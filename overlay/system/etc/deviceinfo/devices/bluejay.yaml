# Device name comes from ro.product.vendor.device=bluejay (vendor/build.prop).
# GridUnit: ro.sf.lcd_density=420 -> 420/160*8 = 21 (Pixel 9 at the same density uses 21).
# Cutout values from /vendor/overlay/framework-res__bluejay__auto_generated_rro_vendor.apk:
#   config_mainBuiltInDisplayCutout = "M 507,66 a 33,33 0 1 0 66,0 33,33 0 1 0 -66,0 Z"
#   config_mainBuiltInDisplayCutoutRectApproximation = "M 480,0 h 145 v 132 h -145 Z"
#   status_bar_height_portrait = 132px, rounded_corner_radius_top = 47px (panel 1080x2400)
bluejay:
  Name: bluejay
  PrettyName: Google Pixel 6a
  Vendor: Google
  DeviceType: phone
  GridUnit: 21
  SupportedOrientations:
    - Portrait
    - InvertedPortrait
    - Landscape
    - InvertedLandscape
  PrimaryOrientation: Portrait
  OfonoPlugin: binder
  CollapsedPanelHeight: 132
  DisplayCutoutsCollapsed:
    - 0 0 47 132
    - 480 0 145 132
    - 1033 0 47 132
