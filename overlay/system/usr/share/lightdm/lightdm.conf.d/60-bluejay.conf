# lsc-wrapper.d/60-bluejay.conf waits up to 90 s for the vendor composer and
# allocator before it starts lomiri-system-compositor. lightdm's default
# unity-compositor-timeout is 60 s, after which lightdm exits and systemd
# restarts it (seen every ~65 s on an early boot).
[Seat:*]
unity-compositor-timeout=150
