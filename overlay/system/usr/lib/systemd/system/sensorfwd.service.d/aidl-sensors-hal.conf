[Service]
# AIDL android.hardware.sensors.ISensors/default v3 (multihal), service
# vendor.sensors-hal-multihal. Without the wait every adaptor fails until a
# restart. At most 75 s (the start timeout is 90 s).
ExecStartPre=/bin/sh -c 'n=0; while [ "$(getprop init.svc.vendor.sensors-hal-multihal 2>/dev/null)" != running ] && [ $$n -lt 150 ]; do sleep 0.5; n=$$((n + 1)); done; exit 0'
