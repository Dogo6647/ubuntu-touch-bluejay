[Service]
# AIDL android.hardware.sensors.ISensors/default v3 (multihal), service name
# vendor.sensors-hal-multihal. Without the gate every adaptor fails until restart.
ExecStartPre=/bin/sh -c 'while [ "$(getprop init.svc.vendor.sensors-hal-multihal 2>/dev/null)" != "running" ]; do sleep 0.5; done'
