[Unit]
After=dev-binderfs.mount android-set-boot-completion-property.service
Wants=dev-binderfs.mount

[Service]
# AIDL android.hardware.vibrator.IVibrator/default (cs40l26). The vendor service is
# "disabled" and only enabled on vendor.all.modules.ready=1 (vendor/etc/init/hw/init.bluejay.rc),
# so hfd's auto-detection can miss it and fall back to the FF input device.
Environment=HFD_VIBRATOR_IMPL=binder-aidl
Environment=HFD_LEDS_IMPL=dummy
ExecStartPre=/bin/sh -c 'while [ ! -e /dev/binderfs/binder ]; do sleep 1; done'
ExecStartPre=/bin/sh -c 'while [ "$(getprop init.svc.vendor.vibrator.cs40l26 2>/dev/null)" != "running" ]; do sleep 0.5; done'
