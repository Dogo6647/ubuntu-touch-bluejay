[Unit]
After=android-set-boot-completion-property.service

[Service]
# /usr/bin/droid/bluebinder_wait.sh greps init.svc.*bluetooth*, but the bluejay
# HAL service is "bcmbtlinux" (vendor/etc/init/android.hardware.bluetooth-service.bcmbtlinux.rc),
# AIDL IBluetoothHci/default. Wait at most 50 s (bluebinder's start timeout is 60 s).
ExecStartPre=
ExecStartPre=/bin/sh -c 'n=0; while [ "$(getprop init.svc.bcmbtlinux 2>/dev/null)" != running ] && [ $$n -lt 100 ]; do sleep 0.5; n=$$((n + 1)); done; exit 0'
# kernel/bluejay.config makes CONFIG_BT_HCIVHCI a module. vendor_dlkm has no
# hci_vhci.ko and the GSI turns off module autoloading, so load ours once the
# vendor bluetooth.ko is in (the HAL is running).
ExecStartPre=-/sbin/modprobe hci_vhci
