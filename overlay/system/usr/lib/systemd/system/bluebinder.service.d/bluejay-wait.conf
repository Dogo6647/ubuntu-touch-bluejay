[Unit]
After=android-set-boot-completion-property.service

[Service]
# /usr/bin/droid/bluebinder_wait.sh greps init.svc.*bluetooth*, but the bluejay HAL
# service is "bcmbtlinux" (vendor/etc/init/android.hardware.bluetooth-service.bcmbtlinux.rc),
# AIDL IBluetoothHci/default. bluebinder >= 1.0.19 speaks AIDL.
ExecStartPre=
ExecStartPre=/bin/sh -c 'while [ "$(getprop init.svc.bcmbtlinux 2>/dev/null)" != "running" ]; do sleep 0.5; done'
